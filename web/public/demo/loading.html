<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo lời chào khi vào web · 3RDHub Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Mrs+Saint+Delafield&family=Allura&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--or:#FF6A2B}
html,body{height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F6F4FB;color:#0B1B3F;overflow:hidden}
.site{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(900px 600px at 80% 10%,rgba(255,106,43,.18),transparent 60%),radial-gradient(800px 600px at 10% 90%,rgba(123,77,255,.18),transparent 60%),#F6F4FB}
.site h1{font-size:clamp(34px,6vw,76px);line-height:1.05;font-weight:900;letter-spacing:-.02em}.site h1 span{color:var(--or)}
.site p{margin-top:14px;font-size:clamp(16px,2vw,22px);color:#5C6577;font-weight:700}
.site .cta{display:inline-block;margin-top:24px;background:var(--or);color:#fff;font-weight:900;padding:14px 30px;border-radius:999px;box-shadow:0 16px 30px -14px var(--or)}
.bar{position:fixed;z-index:100;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(40,40,48,.88);backdrop-filter:blur(8px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:96vw;overflow-x:auto;scrollbar-width:none}
.bar button{font:inherit;font-weight:800;font-size:14px;color:#D5D8E4;background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bar button.on{background:var(--or);color:#fff}.bar .re{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
/* lớp lời chào, kiểu tối giản */
.ld{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:#05060B;color:#fff;transition:opacity .9s ease,visibility .9s}
.ld.light{background:#fff;color:#111}
.ld.gone{opacity:0;visibility:hidden}
.ld[hidden]{display:none}
.ld::before{content:"";position:absolute;inset:0;background:radial-gradient(60vmax 40vmax at 50% 55%,rgba(255,106,43,.16),transparent 70%),radial-gradient(50vmax 40vmax at 50% 45%,rgba(123,77,255,.14),transparent 70%);opacity:.9}
.ld.light::before{opacity:.5}
.stage{position:relative;width:min(92vw,920px);aspect-ratio:920/300}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.w{font-family:var(--hf,"Sacramento"),"Segoe Script","Brush Script MT",cursive;font-size:230px;fill:currentColor}
.w.fin{fill:url(#fg)}
.glow{filter:drop-shadow(0 0 14px rgba(255,170,90,.55))}
.pen{fill:#fff;filter:drop-shadow(0 0 10px #FFB066) drop-shadow(0 0 22px rgba(255,106,43,.9));opacity:0}
.brand{position:absolute;left:0;right:0;bottom:11vh;display:flex;justify-content:center;align-items:center;gap:12px;font-weight:900;font-size:clamp(17px,2.4vw,24px);letter-spacing:.01em;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
.brand.on{opacity:.95;transform:none}
.brand svg{width:34px;height:auto}.brand em{font-style:normal;color:#FF7A3D}
.tag{position:absolute;left:0;right:0;bottom:7vh;text-align:center;font-weight:700;font-size:clamp(12px,1.6vw,15px);letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .9s ease .3s;color:rgba(255,255,255,.55)}
.ld.light .tag{color:rgba(0,0,0,.5)}
.tag.on{opacity:1}
</style>
</head>
<body>
<div class="site"><div><h1>Tiếp thị liên kết,<br><span>minh bạch từng đồng.</span></h1><p>Đây là trang web hiện ra sau lời chào (mô phỏng).</p><span class="cta">Đăng ký ngay</span></div></div>
<div class="bar" aria-label="Tuỳ chọn demo">
  <button class="on" data-f="Sacramento" type="button">Chữ 1</button>
  <button data-f="Allura" type="button">Chữ 2</button>
  <button data-f="Mrs Saint Delafield" type="button">Chữ 3</button>
  <button class="re" id="th" type="button">Nền tối</button>
  <button class="re" id="lg" type="button">VI</button>
  <button class="re" id="re" type="button">↻ Chạy lại</button>
</div>
<div class="ld" id="ld" hidden>
  <div class="stage"><svg id="sv" viewBox="0 0 920 300" aria-hidden="true"></svg></div>
  <div class="brand" id="br"><svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="5" y="3" width="54" height="30" rx="14"/><path d="M18 37.5h28" stroke-width="3"/><rect x="18" y="13.5" width="5" height="12" rx="2.5" fill="currentColor" stroke="none"/><path d="M37 23a5.5 5.5 0 0 1 10 0" stroke="#FF6A2B"/></svg><span>3RDHub <em>Vietnam</em></span></div>
  <div class="tag" id="tg"></div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg'
  var L = {
    vi: { words: ['Hello', 'Bonjour', 'Hola', 'Ciao', 'Olá', 'Xin chào'], tag: 'Tiếp thị liên kết, minh bạch từng đồng' },
    en: { words: ['Xin chào', 'Bonjour', 'Hola', 'Ciao', 'Olá', 'Hello'], tag: 'Affiliate marketing, transparent to the last dong' }
  }
  var ld = document.getElementById('ld'), sv = document.getElementById('sv'), br = document.getElementById('br'), tg = document.getElementById('tg')
  var lang = 'vi', font = 'Sacramento', light = false, timers = [], raf = 0
  function clear() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf) }
  function at(ms, f) { timers.push(setTimeout(f, ms)) }
  function el(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e }
  var ease = function (u) { return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }

  // viết một từ: mặt nạ gradient quét từ trái sang phải như nét bút, kèm chấm sáng chạy theo đầu nét
  function write(word, ms, final, done) {
    sv.innerHTML = ''
    var defs = el('defs', {})
    var g = el('linearGradient', { id: 'fg', x1: 0, y1: 0, x2: 0, y2: 1 })
    ;[['0', '#FFF3C8'], ['.55', '#FFC247'], ['1', '#FF7A3D']].forEach(function (s) { g.appendChild(el('stop', { offset: s[0], 'stop-color': s[1] })) })
    defs.appendChild(g)
    var m = el('mask', { id: 'mk', maskUnits: 'userSpaceOnUse', x: -100, y: -100, width: 1120, height: 500 })
    var mg = el('linearGradient', { id: 'mgr', x1: 0, y1: 0, x2: 1, y2: 0 })
    ;[['0', '#fff'], ['.78', '#fff'], ['1', '#000']].forEach(function (s) { mg.appendChild(el('stop', { offset: s[0], 'stop-color': s[1] })) })
    defs.appendChild(mg)
    var rect = el('rect', { x: -100, y: -100, width: 140, height: 500, fill: 'url(#mgr)' })
    m.appendChild(rect); defs.appendChild(m); sv.appendChild(defs)
    var t = el('text', { class: 'w' + (final ? ' fin' : ''), x: 0, y: 215, mask: 'url(#mk)' })
    t.style.setProperty('--hf', '"' + font + '"'); t.textContent = word
    var gg = el('g', { class: final ? 'glow' : '' }); gg.appendChild(t); sv.appendChild(gg)
    var w = t.getComputedTextLength(), x0 = (920 - w) / 2
    t.setAttribute('x', x0); rect.setAttribute('x', -100)
    var pen = el('circle', { class: 'pen', r: 5, cx: x0, cy: 150 }); sv.appendChild(pen)
    var t0 = performance.now(), L0 = x0 - 60, L1 = x0 + w + 40
    ;(function step(now) {
      var u = Math.min(1, (now - t0) / ms), e = ease(u), x = L0 + (L1 - L0) * e
      rect.setAttribute('x', x - 140); rect.setAttribute('width', 140 + (920 + 200))
      // chỉ phần phía trước đầu nét bị che: gradient nằm ở rìa phải của rect nên dịch cả rect
      rect.setAttribute('x', -1000 + x); rect.setAttribute('width', 1000 + 40)
      pen.setAttribute('cx', Math.min(x, x0 + w - 6)); pen.setAttribute('cy', 150 + Math.sin(e * w / 38) * 34)
      pen.style.opacity = u < 1 ? .95 : 0
      if (u < 1) raf = requestAnimationFrame(step); else if (done) done()
    })(performance.now())
  }
  function erase(ms, done) {
    sv.style.transition = 'opacity ' + ms + 'ms ease, filter ' + ms + 'ms ease'
    sv.style.opacity = 0; sv.style.filter = 'blur(10px)'
    at(ms + 40, function () { sv.style.transition = 'none'; sv.style.opacity = 1; sv.style.filter = 'none'; done() })
  }
  function run() {
    clear(); var T = L[lang]; ld.hidden = false; ld.className = 'ld' + (light ? ' light' : '')
    br.className = 'brand'; tg.className = 'tag'; tg.textContent = T.tag; sv.innerHTML = ''
    ld.style.setProperty('--x', 0); void ld.offsetWidth
    var i = 0
    ;(function next() {
      var final = i === T.words.length - 1
      write(T.words[i], final ? 1500 : 850, final, function () {
        if (final) {
          at(300, function () { br.classList.add('on'); tg.classList.add('on') })
          at(2300, function () { ld.classList.add('gone'); at(1000, function () { ld.hidden = true }) })
        } else at(200, function () { erase(260, function () { i++; next() }) })
      })
    })()
  }
  document.querySelectorAll('.bar [data-f]').forEach(function (b) { b.addEventListener('click', function () {
    document.querySelectorAll('.bar [data-f]').forEach(function (x) { x.classList.toggle('on', x === b) }); font = b.dataset.f; run() }) })
  document.getElementById('re').addEventListener('click', run)
  document.getElementById('th').addEventListener('click', function (e) { light = !light; e.target.textContent = light ? 'Nền sáng' : 'Nền tối'; run() })
  document.getElementById('lg').addEventListener('click', function (e) { lang = lang === 'vi' ? 'en' : 'vi'; e.target.textContent = lang.toUpperCase(); run() })
  var q = new URLSearchParams(location.search); if (q.get('lang') === 'en') { lang = 'en'; document.getElementById('lg').textContent = 'EN' }
  if (q.get('light')) { light = true; document.getElementById('th').textContent = 'Nền sáng' }
  if (q.get('f')) font = q.get('f')
  ;(document.fonts && document.fonts.load ? Promise.all(['Sacramento', 'Allura', 'Mrs Saint Delafield'].map(function (f) { return document.fonts.load('48px "' + f + '"') })) : Promise.resolve()).then(run, run)
})()
</script>
</body>
</html>
