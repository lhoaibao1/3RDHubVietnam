<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo hiệu ứng loading · 3RDHub Vietnam</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--or:#FF6A2B;--navy:#0B1B4A}
html,body{height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F6F4FB;color:#0B1B3F;overflow:hidden}
/* trang web bên dưới (mô phỏng) */
.site{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(900px 600px at 80% 10%,rgba(255,106,43,.18),transparent 60%),radial-gradient(800px 600px at 10% 90%,rgba(123,77,255,.18),transparent 60%),#F6F4FB}
.site h1{font-size:clamp(34px,6vw,76px);line-height:1.05;font-weight:900;letter-spacing:-.02em}
.site h1 span{color:var(--or)}
.site p{margin-top:14px;font-size:clamp(16px,2vw,22px);color:#5C6577;font-weight:700}
.site .cta{display:inline-block;margin-top:24px;background:var(--or);color:#fff;font-weight:900;padding:14px 30px;border-radius:999px;box-shadow:0 16px 30px -14px var(--or)}
/* bộ chọn mẫu */
.bar{position:fixed;z-index:100;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(11,27,74,.88);backdrop-filter:blur(8px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.bar button{font:inherit;font-weight:800;font-size:14px;color:#C9D4FF;background:none;border:0;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bar button.on{background:var(--or);color:#fff}
.bar .re{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
/* lớp loading */
.ld{position:fixed;inset:0;z-index:50;color:#fff;overflow:hidden;
  background:radial-gradient(900px 600px at 80% 8%,rgba(255,106,43,.35),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(123,77,255,.45),transparent 60%),linear-gradient(140deg,#071447,#122371 55%,#2B1A78)}
.ld::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask:radial-gradient(circle at 50% 50%,#000,transparent 75%);mask:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
.ld[hidden]{display:none}
.mid{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center}
.logo{width:clamp(120px,22vw,190px);height:auto;overflow:visible}
.logo *{vector-effect:non-scaling-stroke}
.word{font-weight:900;font-size:clamp(28px,5vw,46px);letter-spacing:-.01em;display:flex;gap:.02em;overflow:hidden;padding-bottom:6px}
.word i{font-style:normal;display:inline-block;transform:translateY(110%);opacity:0}
.word i.o{color:#FF7A3D}
.pc{font-weight:900;font-size:15px;letter-spacing:.18em;color:#B8C4F0;font-variant-numeric:tabular-nums}
.track{width:min(300px,64vw);height:5px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.track b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#FF6A2B,#FFB238)}
/* ===== Mẫu 1: vẽ logo + kéo màn ===== */
.m1{background:none}.m1::before{transition:opacity .3s}.m1.out::before{opacity:0}
.m1 .half{position:absolute;left:0;right:0;height:50%;z-index:2;background:radial-gradient(900px 600px at 80% 8%,rgba(255,106,43,.35),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(123,77,255,.45),transparent 60%),linear-gradient(140deg,#071447,#122371 55%,#2B1A78);background-size:100vw 100vh;background-repeat:no-repeat}
.m1 .half.a{top:0;background-position:0 0}.m1 .half.b{bottom:0;background-position:0 100%}
.m1 .mid{z-index:3}
.m1.go .logo .box{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s cubic-bezier(.6,0,.2,1) forwards}
.m1.go .logo .base{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s .8s ease-out forwards}
.m1.go .logo .eye{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:pop .45s 1.0s cubic-bezier(.3,1.6,.5,1) forwards}
.m1.go .logo .smile{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scaleY(1)}}
.m1.go .word i{animation:rise .6s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(1.1s + var(--n)*45ms)}
@keyframes rise{to{transform:none;opacity:1}}
.m1.go .track b{animation:fill 2.2s .2s cubic-bezier(.5,.1,.2,1) forwards}
@keyframes fill{to{width:100%}}
.m1.out .mid{animation:fade .35s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.06)}}
/* ===== Mẫu 2: robot nháy mắt + sóng + mở vòng tròn ===== */
.m2 .ring{position:absolute;left:50%;top:50%;width:clamp(150px,26vw,230px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,150,90,.55);transform:translate(-50%,-50%) scale(.6);opacity:0}
.m2.go .ring{animation:ring 1.8s ease-out infinite}
.m2.go .ring:nth-of-type(2){animation-delay:.6s}.m2.go .ring:nth-of-type(3){animation-delay:1.2s}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
.m2 .logo{transform:scale(.4);opacity:0}
.m2.go .logo{animation:logoin .7s .1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes logoin{to{transform:none;opacity:1}}
.m2.go .logo .eye{transform-box:fill-box;transform-origin:center;animation:blink 2.2s .8s ease-in-out infinite}
@keyframes blink{0%,86%,100%{transform:scaleY(1)}92%{transform:scaleY(.1)}}
.m2.go .logo .smile{animation:wink 2.2s .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wink{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-3px) scale(1.06)}}
.m2.go .word i{animation:rise .6s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(.7s + var(--n)*45ms)}
.m2.go .track b{animation:fill 2.3s .2s linear forwards}
.m2.out{animation:iris .9s cubic-bezier(.7,0,.2,1) forwards}
@keyframes iris{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0 at 50% 50%)}}
/* ===== Mẫu 3: chữ lớn đổ đầy + đếm % + kéo lên ===== */
.m3 .big{position:relative;font-weight:900;font-size:clamp(70px,17vw,210px);line-height:.95;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35)}
.m3 .big span{position:absolute;left:0;top:0;color:#fff;-webkit-text-stroke:0;clip-path:inset(100% 0 0 0);background:linear-gradient(180deg,#FFE9B0,#FFB238 45%,#FF6A2B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.m3 .big small{display:block;font-size:.2em;letter-spacing:.3em;font-weight:900;color:#FFB08A;-webkit-text-stroke:0;text-transform:uppercase;margin-top:.5em;-webkit-text-fill-color:#FFB08A}
.m3 .num{font-weight:900;font-size:clamp(30px,5vw,54px);font-variant-numeric:tabular-nums;color:#fff}
.m3 .num sup{font-size:.5em;color:#FFB08A;margin-left:2px}
.m3.out{animation:curtain .85s cubic-bezier(.75,0,.2,1) forwards}
@keyframes curtain{to{transform:translateY(-105%)}}
.m3 .edge{position:absolute;left:0;right:0;bottom:-1px;transform:translateY(100%);height:12vh;fill:#2B1A78}
.m3 .edge path{fill:#2B1A78}
</style>
</head>
<body>
<div class="site"><div><h1>Tiếp thị liên kết,<br><span>minh bạch từng đồng.</span></h1><p>Đây là trang web hiện ra sau khi loading xong (mô phỏng).</p><span class="cta">Đăng ký ngay</span></div></div>

<div class="bar" role="tablist" aria-label="Chọn mẫu">
  <button class="on" data-m="1" type="button">Mẫu 1 · Vẽ logo</button>
  <button data-m="2" type="button">Mẫu 2 · Robot nháy mắt</button>
  <button data-m="3" type="button">Mẫu 3 · Chữ đổ đầy</button>
  <button class="re" id="re" type="button">↻ Chạy lại</button>
</div>

<div class="ld m1" id="ld" hidden></div>

<template id="t1">
  <div class="half a"></div><div class="half b"></div>
  <div class="mid">
    <svg class="logo" viewBox="0 0 64 40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true">
      <rect class="box" pathLength="1" x="5" y="3" width="54" height="30" rx="14"/>
      <path class="base" pathLength="1" d="M18 37.5h28" stroke-width="3"/>
      <rect class="eye" x="18" y="13.5" width="5" height="12" rx="2.5" fill="#fff" stroke="none"/>
      <path class="smile" pathLength="1" d="M37 23a5.5 5.5 0 0 1 10 0" stroke="#FF6A2B"/>
    </svg>
    <div class="word" data-w="3RDHub Vietnam"></div>
    <div class="track"><b></b></div><div class="pc">0%</div>
  </div>
</template>
<template id="t2">
  <i class="ring"></i><i class="ring"></i><i class="ring"></i>
  <div class="mid">
    <svg class="logo" viewBox="0 0 64 40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true">
      <rect x="5" y="3" width="54" height="30" rx="14"/>
      <path d="M18 37.5h28" stroke-width="3"/>
      <rect class="eye" x="18" y="13.5" width="5" height="12" rx="2.5" fill="#fff" stroke="none"/>
      <path class="smile" d="M37 23a5.5 5.5 0 0 1 10 0" stroke="#FF6A2B"/>
    </svg>
    <div class="word" data-w="3RDHub Vietnam"></div>
    <div class="track"><b></b></div><div class="pc">0%</div>
  </div>
</template>
<template id="t3">
  <div class="mid">
    <div class="big">3RDHub<span aria-hidden="true">3RDHub</span><small>Vietnam</small></div>
    <div class="num"><b id="n3">0</b><sup>%</sup></div>
  </div>
  <svg class="edge" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h1440v30C1100 90 340 90 0 30z"/></svg>
</template>

<script>
(function () {
  var ld = document.getElementById('ld'), cur = 1, timers = [], raf = 0
  var $ = function (s, r) { return (r || document).querySelector(s) }
  function clear() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf) }
  function build(m) {
    ld.className = 'ld m' + m
    ld.innerHTML = ''
    ld.appendChild(document.getElementById('t' + m).content.cloneNode(true))
    var w = $('.word', ld)
    if (w) {
      var txt = w.getAttribute('data-w'); w.innerHTML = ''
      for (var i = 0; i < txt.length; i++) {
        var s = document.createElement('i'); s.style.setProperty('--n', i)
        s.textContent = txt[i] === ' ' ? ' ' : txt[i]
        if (i >= 6) s.className = 'o'
        w.appendChild(s)
      }
    }
  }
  // % giả lập theo thời gian (khi gắn vào website thật sẽ theo tiến độ tải)
  function count(ms, done) {
    var t0 = performance.now(), pc = $('.pc', ld), n3 = $('#n3', ld), big = $('.big span', ld)
    function step(t) {
      var u = Math.min(1, (t - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2, v = Math.round(e * 100)
      if (pc) pc.textContent = v + '%'
      if (n3) n3.textContent = v
      if (big) big.style.clipPath = 'inset(' + (100 - e * 100) + '% 0 0 0)'
      if (u < 1) raf = requestAnimationFrame(step); else done()
    }
    raf = requestAnimationFrame(step)
  }
  function run(m) {
    clear(); cur = m
    document.querySelectorAll('.bar [data-m]').forEach(function (b) { b.classList.toggle('on', +b.dataset.m === m) })
    build(m); ld.hidden = false
    void ld.offsetWidth
    ld.classList.add('go')
    count(2500, function () {
      ld.classList.add('out')
      if (m === 1) {
        var h = ld.querySelectorAll('.half')
        timers.push(setTimeout(function () {
          h[0].style.transition = h[1].style.transition = 'transform .9s cubic-bezier(.7,0,.2,1)'
          h[0].style.transform = 'translateY(-100%)'; h[1].style.transform = 'translateY(100%)'
        }, 250))
        timers.push(setTimeout(function () { ld.hidden = true }, 1300))
      } else timers.push(setTimeout(function () { ld.hidden = true }, m === 2 ? 950 : 900))
    })
  }
  document.querySelectorAll('.bar [data-m]').forEach(function (b) { b.addEventListener('click', function () { run(+b.dataset.m) }) })
  document.getElementById('re').addEventListener('click', function () { run(cur) })
  var q = +(new URLSearchParams(location.search).get('m')) || 1
  run(q)
})()
</script>
</body>
</html>
