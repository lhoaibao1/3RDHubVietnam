<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem('3rd-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var r=document.documentElement;r.dataset.theme=t;r.style.colorScheme=t}catch(e){}})()</script>
<title>3RDHub Vietnam</title>
<meta name="description" content="3RDHub Vietnam, nền tảng tiếp thị liên kết thuộc 3RDVN Technology. Mỗi lượt bấm, mỗi hồ sơ và mỗi đồng hoa hồng đều được ghi nhận.">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="3RDHub Vietnam">
<meta property="og:title" content="3RDHub Vietnam">
<meta property="og:description" content="Nền tảng tiếp thị liên kết, minh bạch từng đồng.">
<meta property="og:url" content="https://3rdhubvietnam.tech/">
<meta property="og:image" content="https://3rdhubvietnam.tech/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://3rdhubvietnam.tech/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
#boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:22px;background:#F3F1EC;color:#0B2A6F;font:900 clamp(26px,5vw,38px) 'Nunito',system-ui,sans-serif;letter-spacing:-.01em;transition:opacity .45s ease,visibility .45s}
html[data-theme=dark] #boot{background:#0E1426;color:#EDF1FF}
#boot i{font-style:normal;color:#FF6A2B}
#boot .bb{width:min(220px,50vw);height:4px;border-radius:4px;background:rgba(127,127,127,.22);overflow:hidden}
#boot .bb span{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#FF6A2B,#FF4D8D,#7B4DFF);animation:bootbar 1.1s ease-in-out infinite}
#boot .bs{font:600 14px 'Nunito',system-ui,sans-serif;opacity:0;transition:opacity .4s;margin-top:-6px;text-align:center}
#boot.slow .bs{opacity:.7}
#boot.off{opacity:0;visibility:hidden;pointer-events:none}
@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media(prefers-reduced-motion:reduce){#boot .bb span{animation:none;width:100%}}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite" aria-label="Đang tải"><div>3RDHub <i>Vietnam</i></div><div class="bb"><span></span></div><div class="bs">Đang tải, vui lòng chờ một chút…</div></div>
<div id="app"></div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.className='slow'},4000)</script>
<noscript><style>#boot{display:none}</style>3RDHub Vietnam cần bật JavaScript để hiển thị nội dung.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
